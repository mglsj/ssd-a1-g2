services:
  app:
    image: ghcr.io/cachix/devenv/devcontainer:latest
    volumes:
      - ..:/workspace:cached
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      MONGO_URI: mongodb://mongo:27017/app
      MONGO_DB: app
      DB: postgresql://postgres:postgres@postgres:5432/app
    depends_on:
      - mongo
      - postgres

  mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  mongo-data:
  postgres-data: